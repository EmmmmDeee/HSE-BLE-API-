name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the advisory/policy gates are reproducible run to run: the
  # advisory *database* they read is already vendored and pinned under
  # vendor/rustsec-advisory-db/, so the *tools* are pinned to match. Bump
  # deliberately in a reviewed change; the cache key below follows the values.
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Restore pinned cargo-audit and cargo-deny binaries
        id: cargo-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-audit-${{ env.CARGO_AUDIT_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Build pinned cargo-audit and cargo-deny (cache miss only)
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}" "cargo-deny@${CARGO_DENY_VERSION}"
      - name: Install pinned JDK for the live JVM → JNI → Rust proof
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run every gate via the local gate runner
        run: cargo xtask gates
      - name: Live JVM → JNI → Rust proof against NativeRadar.java
        run: cargo xtask verify-jni-live

  android-apk:
    # The app must build from a fresh checkout: cross-compile the JNI library,
    # aapt2, javac against the real android.jar, d8, sign, then inspect the
    # package (entries, DEX classes, export contract). Java that only ever
    # compiled in a reviewer's head reached main before this job existed
    # (docs/AUTONOMOUS_DECISIONS.md #86), so it runs on every pull request
    # and on every push to main (the workflow's push trigger above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add the Android cross-compilation target
        run: rustup target add aarch64-linux-android
      - name: Install pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The versions live in xtask (PINNED_* in xtask/src/main.rs), which is
      # also what discovery prefers over anything else the runner image ships.
      - name: Install the pinned Android platform, build-tools and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' $(seq 1 30) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install $(cargo xtask android-sdk-packages)
      - name: Build, sign and inspect the APK
        run: cargo xtask verify-android-live
      # The shipped library is aarch64/Bionic; the JVM proof above runs on the
      # x86_64 host. Execute the crate's whole test suite on the target ABI
      # under qemu-user against a Bionic runtime extracted once from the
      # android-24 arm64 system image (~5 MB, cached; the image itself is
      # 2.6 GB and only downloaded on a cache miss).
      - name: Install qemu-user-static and e2fsprogs for the target-ABI proof
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static e2fsprogs
      # The cache key is derived from the pinned image package xtask prints,
      # so changing PINNED_SYSTEM_IMAGE_* in xtask invalidates the cached
      # runtime instead of silently reusing the old one.
      - name: Name the pinned Bionic runtime
        id: sdk
        run: echo "image=$(cargo xtask android-sdk-packages --system-image | tr ';' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the extracted Bionic runtime
        id: bionic
        uses: actions/cache@v4
        with:
          path: ~/.cache/bionic-sysroot
          key: bionic-sysroot-${{ steps.sdk.outputs.image }}-r1
      - name: Extract the Bionic runtime from the system image (cache miss only)
        if: steps.bionic.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install $(cargo xtask android-sdk-packages --system-image)
          cargo xtask prepare-bionic-sysroot "$HOME/.cache/bionic-sysroot"
      - name: Run the bleradar-jni test suite on aarch64/Bionic under qemu
        run: BIONIC_SYSROOT="$HOME/.cache/bionic-sysroot" cargo xtask verify-jni-target

  web-dashboard:
    # The page ApiHttpServer serves at / must render live data in a real
    # browser engine: xtask serves the committed assets/dashboard.html next
    # to a mock of the documented JSON contract, headless Chromium (the
    # runner image ships Google Chrome) loads it, and the rendered DOM is
    # checked for every device, the poll counter, and the error banner when
    # the API answers 500 or the wrong shape (docs/AUTONOMOUS_DECISIONS.md #89).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Render the dashboard in headless Chromium against a mock of the JSON contract
        run: cargo xtask verify-dashboard-live
