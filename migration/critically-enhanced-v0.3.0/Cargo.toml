[workspace]
resolver = "2"
members = ["crates/bleradar-core", "crates/bleradar-compat", "crates/bleradar-tools"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
